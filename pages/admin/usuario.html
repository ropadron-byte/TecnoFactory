<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuarios — Panel Tecno Factory</title>
<link rel="stylesheet" href="../../css/estilos.css">
</head>
<body>

<header class="site-header">
  <div class="wrap nav">
    <a href="home.html" class="logo"><span class="logo-mark" aria-hidden="true"></span> Tecno Factory Admin</a>
  </div>
</header>

<div class="admin-wrap">
  <nav class="admin-sidebar">
    <a href="home.html">Inicio</a>
    <a href="usuario.html" aria-current="page">Usuarios</a>
    <a href="../admin-producto/producto.html">Productos</a>
  </nav>

  <main class="admin-content">
    <h1>Usuarios</h1>
    <p><a class="btn accent small" href="nuevo_usuario.html">+ Nuevo usuario</a></p>

    <table class="admin-table">
      <thead>
        <tr>
          <th>RUN</th>
          <th>Nombre</th>
          <th>Correo</th>
          <th>Tipo</th>
          <th>Comuna</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-usuarios">
      </tbody>
    </table>
  </main>
</div>

<script src="../../js/usuarios.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const tbody = document.getElementById("tabla-usuarios");
    const usuarios = obtenerUsuarios();

    if (usuarios.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6">Aún no hay usuarios registrados.</td></tr>';
      return;
    }

    usuarios.forEach(function (u) {
      const tr = document.createElement("tr");
      tr.innerHTML =
        "<td>" + u.run + "</td>" +
        "<td>" + u.nombre + " " + u.apellidos + "</td>" +
        "<td>" + u.correo + "</td>" +
        "<td><span class='badge " + u.tipo.toLowerCase() + "'>" + u.tipo + "</span></td>" +
        "<td>" + u.comuna + "</td>" +
        "<td class='admin-actions'>" +
          "<a class='btn ghost small' href='mostrar_usuario.html?id=" + u.id + "'>Ver</a>" +
          "<a class='btn ghost small' href='editar_usuario.html?id=" + u.id + "'>Editar</a>" +
        "</td>";
      tbody.appendChild(tr);
    });
  });
</script>

</body>
</html>
